<div class="container py-4 listar-respaldos">
  <h2 class="mb-4">Respaldos disponibles</h2>

  <div class="card shadow-sm mb-4">
    <div class="card-body d-flex flex-column flex-lg-row align-items-lg-center justify-content-lg-between gap-3">
      <div>
        <p class="mb-1 fw-semibold">Carpeta predeterminada</p>
        <code>{{ ultimaRuta }}</code>
      </div>
      <button class="btn btn-consultar" type="button" [disabled]="cargando" (click)="actualizarLista()">
        <span *ngIf="!cargando">Actualizar lista</span>
        <span *ngIf="cargando" class="spinner-border spinner-border-sm"></span>
      </button>
    </div>
  </div>

  <div class="table-responsive" *ngIf="respaldos.length > 0">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Archivo</th>
          <th>Tamaño (MB)</th>
          <th>Tamaño (bytes)</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let respaldo of respaldos">
          <td>{{ respaldo.nombreArchivo }}</td>
          <td>{{ tamanoMB(respaldo) }}</td>
          <td>{{ tamanoBytes(respaldo) }}</td>
          <td class="text-center">
            <button
              class="btn btn-restaurar"
              type="button"
              (click)="restaurar(respaldo)"
              [disabled]="restaurandoArchivo === respaldo.nombreArchivo"
            >
              <span *ngIf="restaurandoArchivo !== respaldo.nombreArchivo">Restaurar</span>
              <span *ngIf="restaurandoArchivo === respaldo.nombreArchivo" class="spinner-border spinner-border-sm"></span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="text-center text-muted" *ngIf="!cargando && respaldos.length === 0">
    No hay respaldos disponibles en la carpeta predeterminada.
  </div>
</div>

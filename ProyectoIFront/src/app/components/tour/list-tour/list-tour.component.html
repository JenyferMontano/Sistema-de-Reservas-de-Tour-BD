<div class="tour-container">
  <h2 class="titulo">Lista de Tours</h2>

  <div class="busqueda">
    <label for="buscar" class="form-label">Buscar tours</label>
    <input id="buscar" type="text" class="form-control" placeholder="Busca por nombre, tipo, ubicación o ID" [(ngModel)]="search">
  </div>

  <table class="tabla-tours" *ngIf="toursFiltrados.length > 0; else noTours">
    <thead>
      <tr>
        <th>Imagen</th>
        <th>ID</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Ubicación</th>
        <th>Precio Base</th>
        <th>Disponibilidad</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tour of toursFiltrados">
        <td>
          <img [src]="getImageUrl(tour.imagetour)" class="thumb" alt="Imagen del tour" />
        </td>
        <td>{{ tour.idtour }}</td>
        <td>{{ tour.nombre }}</td>
        <td>{{ tour.tipo }}</td>
        <td>{{ tour.ubicacion }}</td>
        <td>{{ tour.preciobase }}</td>
        <td>
          <span *ngIf="tour.disponibilidad === 1" class="text-success">Disponible</span>
          <span *ngIf="tour.disponibilidad === 2" class="text-danger">No disponible</span>
        </td>
        <td>
          <button class="btn btn-sm btn-edit" (click)="onEditar(tour)">Editar</button>
          <button class="btn btn-sm btn-delete" (click)="onEliminar(tour)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noTours>
    <div>No hay tours registrados.</div>
  </ng-template>
</div>
